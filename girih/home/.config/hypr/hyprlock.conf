# Girih lock screen: blurred lattice ground, brass emblem, Cormorant Garamond clock,
# gold → brass → emerald framed glass input.

general {
    hide_cursor = true
    immediate_render = true
}

animations {
    enabled = true
}

background {
    monitor =
    path = ~/.config/hypr/girih/wallpaper.png
    color = rgb(0B0E14)
    blur_passes = 3
    blur_size = 6
    brightness = 0.72
    vibrancy = 0.18
    noise = 0.01
}

# ---- emblem: two brass squares, emerald keystone, faint ring ------------

shape {
    monitor =
    size = 250, 250
    rounding = -1
    color = rgba(00000000)
    border_size = 1
    border_color = rgba(C9A24A66)
    position = 0, 250
    halign = center
    valign = center
}

shape {
    monitor =
    size = 150, 150
    rounding = 0
    color = rgba(12182640)
    border_size = 2
    border_color = rgba(C9A24AFF)
    position = 0, 250
    halign = center
    valign = center
}

shape {
    monitor =
    size = 150, 150
    rounding = 0
    rotate = 45
    color = rgba(00000000)
    border_size = 2
    border_color = rgba(C9A24AFF)
    position = 0, 250
    halign = center
    valign = center
}

shape {
    monitor =
    size = 62, 62
    rounding = 0
    rotate = 45
    color = rgba(0F6B4FFF)
    border_size = 1
    border_color = rgba(E6C36AFF)
    position = 0, 250
    halign = center
    valign = center
}

# ---- time and date -----------------------------------------------------

label {
    monitor =
    text = <span font_weight="600">$TIME</span>
    color = rgba(F2EAD8FF)
    font_size = 110
    font_family = Cormorant Garamond
    position = 0, 40
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "<span letter_spacing='3000'>$(date +'%A  ·  %d %B %Y' | tr '[:lower:]' '[:upper:]')</span>"
    color = rgba(C9A24AFF)
    font_size = 13
    font_family = Manrope
    position = 0, -40
    halign = center
    valign = center
}

# ---- input: glass panel with the active-window gradient ---------------

input-field {
    monitor =
    size = 420, 52
    outline_thickness = 2
    outer_color = rgba(E6C36AFF) rgba(C9A24AFF) rgba(0F6B4FFF) 135deg
    inner_color = rgba(121826B8)
    font_color = rgba(F2EAD8FF)
    font_family = JetBrainsMono Nerd Font
    check_color = rgba(E6C36AFF) rgba(C9A24AFF) 135deg
    fail_color = rgba(C0503FFF)
    capslock_color = rgba(1F4E9CFF)
    rounding = 0
    dots_size = 0.2
    dots_spacing = 0.6
    dots_center = true
    dots_rounding = 0
    fade_on_empty = false
    placeholder_text = <span foreground="##A8A090">◆   password</span>
    fail_text = <span foreground="##D9705E">$FAIL</span>
    check_text = <span foreground="##E6C36A">verifying</span>
    position = 0, -120
    halign = center
    valign = center
}

# Name in Cormorant Garamond Italic beside a rotating Arabic saying in Amiri.
# Edit the sayings in ~/.config/hypr/girih/sayings.txt.
label {
    monitor =
    text = cmd[update:600000] $HOME/.local/bin/girih-lock-saying
    color = rgba(E6C36AFF)
    font_size = 20
    font_family = Amiri
    position = 0, -195
    halign = center
    valign = center
}

# ---- footer --------------------------------------------------------------

label {
    monitor =
    text = GIRIH  ·  HATTIN
    color = rgba(C9A24A99)
    font_size = 10
    font_family = JetBrainsMono Nerd Font
    position = 0, 36
    halign = center
    valign = bottom
}
