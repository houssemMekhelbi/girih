# Girih launcher: centred, ~40% of a 1080p screen, 82% glass, gradient-less
# Brass frame (fuzzel draws a single border colour). Blur comes from the
# Hyprland layer rule girih-launcher-glass (namespace "launcher").

[main]
font=Readex Pro:size=10.5,Reem Kufi:size=10.5
use-bold=no
prompt="✴  "
placeholder=search
icons-enabled=yes
match-counter=yes
anchor=center
lines=8
width=90
horizontal-pad=18
vertical-pad=14
inner-pad=10
line-height=24
letter-spacing=0.2
layer=overlay
terminal=foot -e

[colors]
# Obsidian 82%
background=0B0E14D1
text=A8A090FF
message=A8A090FF
prompt=E6C36AFF
placeholder=A8A09080
input=F2EAD8FF
# fuzzel cannot underline matches; Brass text is the closest match
match=C9A24AFF
# Raised Slate 60%
selection=1A223399
selection-text=F2EAD8FF
selection-match=E6C36AFF
counter=C9A24AFF
border=C9A24AFF

[border]
width=2
radius=0
