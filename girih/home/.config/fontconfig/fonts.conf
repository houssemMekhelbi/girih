<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Girih type ("Manuscript"): Latin-first faces, Arabic companions.
       display    Cormorant Garamond  + Reem Kufi for Arabic
       interface  Manrope             + Readex Pro for Arabic
       mono       JetBrains Mono Nerd Font
     <accept> puts the companion directly after the Latin face in the
     fallback list, so only glyphs the Latin face lacks (Arabic) use it. -->
<fontconfig>
  <alias binding="same">
    <family>Manrope</family>
    <accept><family>Readex Pro</family></accept>
  </alias>
  <alias binding="same">
    <family>Cormorant Garamond</family>
    <accept><family>Reem Kufi</family></accept>
  </alias>
  <alias binding="same">
    <family>JetBrainsMono Nerd Font</family>
    <accept><family>Readex Pro</family></accept>
  </alias>

  <alias binding="same">
    <family>sans-serif</family>
    <prefer>
      <family>Manrope</family>
      <family>Readex Pro</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>monospace</family>
    <prefer>
      <family>JetBrainsMono Nerd Font</family>
      <family>Readex Pro</family>
      <family>Noto Sans Mono</family>
    </prefer>
  </alias>
</fontconfig>
