# Girih tmux: status at the bottom, Brass session block cut on the right,
# Emerald clock block cut on the left, mirroring the Waybar lintels.
# The 45° cuts use Nerd Font half-block slopes (JetBrainsMono Nerd Font).

set -g default-terminal "tmux-256color"
set -as terminal-features ",foot*:RGB,alacritty*:RGB,xterm-ghostty:RGB,xterm-256color:RGB"

# One status line in tmux's stock layout. Another theme (Nordschleife) runs two lines with its own
# status-format; a running server keeps those across a theme switch unless they are reset here.
set -g status on
set -gu status-format


set -g status-position bottom
set -g status-interval 15
set -g status-justify left
set -g status-style "bg=#121826,fg=#A8A090"

# Session: Brass block, slanted right edge (◤ cut, U+E0BC).
set -g status-left-length 40
set -g status-left "#[bg=#C9A24A,fg=#0B0E14,bold] ◆ #{=/24/…:session_name} #[nobold]#[bg=#121826,fg=#C9A24A] "

# Clock: Emerald block, slanted left edge (◢ cut, U+E0BA).
set -g status-right-length 40
set -g status-right "#[bg=#121826,fg=#0F6B4F]#[bg=#0F6B4F,fg=#F2EAD8] %H:%M "

# Windows: glyph index:name.
#   active    filled star, Gold on Raised Slate
#   inactive  outlined diamond, Muted Ivory
#   activity  Lapis diamond
set -g window-status-separator ""
set -g window-status-format "#[fg=#A8A090] #{?window_activity_flag,#[fg=#3F74D0]◆,◇} #I:#W "
set -g window-status-current-format "#[bg=#1A2233,fg=#E6C36A] ✦ #I:#W "
set -g window-status-activity-style "none"
set -g monitor-activity on
set -g visual-activity off

# Pane borders: active Emerald, inactive Hairline Slate.
set -g pane-border-lines single
set -g pane-border-style "fg=#2a3345"
set -g pane-active-border-style "fg=#0f6b4f"
set -g pane-border-indicators off

# Messages, prompts, copy-mode selection, menus.
set -g message-style "bg=#1A2233,fg=#F2EAD8"
set -g message-command-style "bg=#1A2233,fg=#E6C36A"
set -g mode-style "bg=#1A2233,fg=#F2EAD8"
set -g copy-mode-match-style "bg=#1A2233,fg=#C9A24A,underscore"
set -g copy-mode-current-match-style "bg=#1A2233,fg=#E6C36A,underscore"
set -g menu-style "bg=#0B0E14,fg=#A8A090"
set -g menu-selected-style "bg=#1A2233,fg=#F2EAD8"
set -g menu-border-style "fg=#C9A24A"
set -g menu-border-lines single
set -g popup-border-style "fg=#C9A24A"
set -g popup-border-lines single
set -g display-panes-colour "#2A3345"
set -g display-panes-active-colour "#E6C36A"
set -g clock-mode-colour "#E6C36A"
