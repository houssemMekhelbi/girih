# Girih terminal. Obsidian at 84%, compositor blur behind it.

[main]
font=JetBrainsMono Nerd Font:size=11
line-height=15.5
pad=16x16
initial-color-theme=dark

[bell]
# A bell in a window without the focus marks it urgent, which the bar's workspace slot shows.
urgent=yes

[cursor]
style=block
blink=no
beam-thickness=2

[colors-dark]
alpha=0.84
blur=yes
background=0B0E14
foreground=A8A090
cursor=0B0E14 E6C36A

regular0=0B0E14
regular1=C0503F
regular2=2E9C6F
regular3=C9A24A
regular4=3F74D0
regular5=9A5FB5
regular6=3FA8A0
regular7=A8A090

bright0=2A3345
bright1=D9705E
bright2=4DBF8C
bright3=E6C36A
bright4=6A97E0
bright5=B884CC
bright6=6CC6BE
bright7=F2EAD8

# Raised Slate, no inversion
selection-foreground=F2EAD8
selection-background=1A2233

jump-labels=0B0E14 E6C36A
scrollback-indicator=0B0E14 C9A24A
search-box-no-match=F2EAD8 C0503F
search-box-match=0B0E14 E6C36A
urls=E6C36A

# The same palette again: a colour-theme key bind cannot pull in foot's stock colours.
[colors-light]
alpha=0.84
blur=yes
background=0B0E14
foreground=A8A090
cursor=0B0E14 E6C36A

regular0=0B0E14
regular1=C0503F
regular2=2E9C6F
regular3=C9A24A
regular4=3F74D0
regular5=9A5FB5
regular6=3FA8A0
regular7=A8A090

bright0=2A3345
bright1=D9705E
bright2=4DBF8C
bright3=E6C36A
bright4=6A97E0
bright5=B884CC
bright6=6CC6BE
bright7=F2EAD8

# Raised Slate, no inversion
selection-foreground=F2EAD8
selection-background=1A2233

jump-labels=0B0E14 E6C36A
scrollback-indicator=0B0E14 C9A24A
search-box-no-match=F2EAD8 C0503F
search-box-match=0B0E14 E6C36A
urls=E6C36A
